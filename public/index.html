<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Щоденник</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Auth Section -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600 mb-2">Мій Щоденник</h1>
                <p id="authSubtitle" class="text-gray-500">Будь ласка, увійдіть у свій акаунт</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="loginEmail" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Пароль</label>
                    <input type="password" id="loginPassword" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-bold shadow-lg">Увійти</button>
            </form>

            <!-- Register Form (hidden) -->
            <form id="registerForm" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ім’я</label>
                    <input type="text" id="regUsername" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="regEmail" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Пароль</label>
                    <input type="password" id="regPassword" required minlength="6" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-bold shadow-lg">Зареєструватися</button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                <span id="authToggleText">Немає акаунту?</span>
                <button id="authToggleBtn" class="text-indigo-600 font-bold hover:underline ml-1">Зареєструватися</button>
            </div>
        </div>
    </div>

    <!-- Main Content (hidden until login) -->
    <div id="mainContent" class="hidden min-h-screen">
        <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold text-indigo-600 flex items-center">
                    <i class="fas fa-book-open mr-2"></i>Щоденник
                </h1>
                <div class="flex items-center space-x-6">
                    <span id="userDisplay" class="text-gray-700 font-medium hidden md:inline"></span>
                    <div class="flex space-x-2">
                        <button id="exportBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition text-sm">
                            <i class="fas fa-file-export mr-1"></i> Експорт
                        </button>
                        <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg transition text-sm font-bold border border-red-200">
                            Вийти
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container mx-auto mt-8 p-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Форма створення -->
            <section class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-lg sticky top-24">
                    <h2 id="formTitle" class="text-xl font-semibold mb-4 text-gray-800">Новий запис</h2>
                    <form id="entryForm" class="space-y-4">
                        <input type="hidden" id="entryId">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Заголовок</label>
                            <input type="text" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Дата</label>
                            <input type="date" id="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Теги (через кому)</label>
                            <input type="text" id="tags" placeholder="робота, ідеї" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Зміст</label>
                            <textarea id="content" rows="5" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></textarea>
                        </div>
                        <div class="flex space-x-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">Зберегти</button>
                            <button type="button" id="cancelBtn" class="hidden flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition font-medium">Скасувати</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Список записів -->
            <section class="lg:col-span-2 space-y-6">
                <div class="bg-white p-4 rounded-xl shadow-md flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex flex-1 min-w-[200px] gap-2">
                        <input type="text" id="searchTag" placeholder="Пошук за тегом..." class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border text-sm">
                        <button id="searchBtn" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-md hover:bg-indigo-200 transition">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="date" id="filterDate" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border text-sm">
                        <button id="filterBtn" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-md hover:bg-indigo-200 transition">
                            Фільтр
                        </button>
                        <button id="resetBtn" class="text-gray-400 hover:text-red-500 px-2 transition">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>
                </div>

                <div id="entriesList" class="space-y-4">
                    <div class="text-center py-10 text-gray-500">Завантаження...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
